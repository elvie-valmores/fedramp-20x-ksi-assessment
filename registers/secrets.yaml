# The rotation interval plan: KSI-SVC-ASM build row 6.
#
# Started 2026-10-03. The determination makes the plan a deliverable: its
# definition of "regularly" requires set intervals following a documented
# plan, so the interval table lives here, versioned, rather than implied by
# whatever each service defaults to. The four classes are the
# determination's own: managed secrets, encryption keys, certificates and
# bearer tokens, each rotating by a different mechanism.
#
# Every secret, key and certificate the inventory reports must match one
# class's member rules (register_read, secrets_owned). The application
# database credential is deliberately absent: KSI-SVC-VCM authenticates that
# connection by IAM token and disables password authentication for the
# application users, so there is no database password to rotate. The master
# user's secret is a managed secret, rotated by RDS.

classes:
  managed_secret:
    mechanism: Secrets Manager native rotation, configured by RDS for the master user secret it creates (manage_master_user_password, database.tf)
    interval_days: 7
    members:
      - {resource_type: "AWS::SecretsManager::Secret", name: "rds!db-*"}
    note: Exists only while the environment stands; RDS creates it at apply and it is deleted with the instance.

  encryption_key:
    mechanism: Provider automatic rotation -- KMS and Cloud KMS -- enabled on every customer-managed key (svc-asm-cfg-aws-keys-rotate, svc-asm-cfg-gcp-keys-rotate). AWS-managed keys are rotated by AWS on its own yearly schedule
    interval_days: 365
    members:
      - {resource_type: "AWS::KMS::Key", name: "*"}
      - {resource_type: "cloudkms.googleapis.com/CryptoKey", name: "*"}

  certificate:
    mechanism: Split by hop (KSI-SVC-ASM build row 4). The listener's ACM certificate renews itself, DNS-validated, about 60 days before expiry. The task's self-signed certificate is issued at every apply of the environment, so it is never older than the session using it
    interval_days: 395
    members:
      - {resource_type: "AWS::SecretsManager::Secret", name: "fedramp-20x-ksi-task-tls*"}
      - {resource_type: "AWS::ACM::Certificate", name: "*"}
    note: 395 days is ACM's validity, the outer bound; the task certificate's validity is 365 days and it lives for one session.

  bearer_token:
    mechanism: A scheduled workflow -- generate, update provisioning, verify provisioning, discard the old token -- for the SCIM provisioning token (KSI-SVC-ASM build row 5)
    interval_days: null
    deferred: SCIM provisioning needs Cloud Identity Premium, deferred until KSI-IAM-AAM's evidence is built (PROJECT-CONTEXT, open items). The class has no member, so there is nothing to rotate; its interval is set when the token exists, not invented before.
    members:
      - {resource_type: "AWS::IdentityStore::ScimToken", name: "*"}

# CI and cross-cloud access hold no secret at all: GitHub Actions and the GCP
# pipeline federate (KSI-IAM-SNU), and terraform-admin is impersonated, never
# keyed. That absence is checked elsewhere, not planned here.
