    reason: 'The automated responder (KSI-IAM-SUS) was descoped on 2026-10-03: automated containment was the riskiest
      automation to build under the deadline, since a bug could lock the operator out. Detection and alerting stand;
      response is the manual procedure in docs/INCIDENT-RESPONSE.md.'
