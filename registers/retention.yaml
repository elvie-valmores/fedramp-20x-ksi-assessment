# The retention register: KSI-SVC-PRR build row 2.
#
# Started 2026-10-03. Everything the project keeps beyond the moment it was
# made, with the reason it is kept and when it goes. The determination's
# point is that retained data is residue unless it has an expiry: an entry
# needs a reason, and either expiry_days or expires_with naming the event
# that removes it. An entry with neither fails the check; that is how the
# open ones below are kept visible instead of forgotten.

entries:
  - what: Log store objects (CloudTrail, normalized events, collector run records)
    where: fedramp-20x-ksi-log-store (S3)
    reason: Audit evidence. 90 days, the lean retention set (2026-10-03) -- shorter than OMB M-21-31's twelve months, chosen because the project ends first; SDR-CSX-KMT's metrics read back over what exists
    expiry_days: 90
  - what: Superseded log store versions
    where: fedramp-20x-ksi-log-store (S3)
    reason: Object Lock keeps each version 7 days; the version hidden by expiry is kept 30 days more
    expiry_days: 30
  - what: Config configuration history files
    where: fedramp-20x-ksi-config (S3)
    reason: The record of how resources were configured; same window as the log store
    expiry_days: 90
  - what: Superseded Terraform state versions
    where: fedramp-20x-ksi-tfstate (S3)
    reason: The depth a state rollback can reach (KSI-RPL-ABO's prior baseline)
    expiry_days: 90
  - what: Extract files
    where: fedramp-20x-ksi-extracts (S3)
    reason: Customer data in transit to GCP; the pipeline re-reads every extract each run, so 30 days is the window a missed run can recover
    expiry_days: 30
  - what: Athena query results
    where: fedramp-20x-ksi-athena-results (S3)
    reason: Re-derivable scratch output
    expiry_days: 7
  - what: Load balancer access logs
    where: The load balancer log bucket (S3, per session)
    reason: Request records for the session's investigation window
    expiry_days: 30
  - what: CloudWatch log groups (Lambdas, containers, RDS, VPC flow logs, WAF)
    where: CloudWatch Logs
    reason: Operational logs; the audit record of the same activity is CloudTrail in the log store
    expiry_days: 30
  - what: Database automated backups and snapshots
    where: RDS, retained after the instance is deleted
    reason: Recovery testing across sessions (2026-09-05); under the persistent database key since 2026-10-03
    expiry_days: 7
  - what: Container images in ECR
    where: fedramp-20x-ksi/api and /worker
    reason: The last 10 builds and their signatures, so a recent deployable image survives builds
    expires_with: The eleventh newer build (lifecycle policy); untagged leftovers after a day
  - what: Session KMS keys after teardown
    where: KMS (secrets and logs keys)
    reason: The deletion window is the recovery path for a teardown made in error
    expiry_days: 7
  - what: Secrets after teardown
    where: Secrets Manager
    reason: Regenerated each session; no recovery window is kept
    expiry_days: 0
  - what: Landing files in GCS
    where: fedramp-20x-ksi-assessment-landing
    reason: Intermediate and regenerable by re-running the pipeline
    expiry_days: 30
  - what: GCP Data Access logs
    where: fedramp-20x-ksi-data-access (Cloud Logging, CMEK)
    reason: The customer-data access record on the GCP side
    expiry_days: 30
  - what: GitHub Actions evidence artifacts
    where: GitHub, per collect.yml run
    reason: The SDR and run outputs per run; the durable copy is the record in the log store
    expiry_days: 90

  # Decided 2026-10-03 (the lean retention set); each had no expiry before.
  - what: Inactive ECS task definition revisions
    where: ECS, per session
    reason: The recent ones are the prior configuration baseline KSI-RPL-ABO counts on; teardown.sh deletes inactive revisions older than this
    expiry_days: 30
  - what: Analytics images in Artifact Registry
    where: fedramp-20x-ksi (Artifact Registry)
    reason: The five most recent are kept; older images go once 30 days old. The pinned digest is checked daily (svc-vri-ops-gcp-pinned-image-present)
    expires_with: Being outside the five most recent and 30 days old (cleanup policy, live since 2026-10-07; nothing qualifies before 2026-10-31)
  - what: The measurements warehouse rows
    where: measurements.measurements (BigQuery)
    reason: The only copy of a measurement past 30 days -- extracts expire then and the database is rebuilt every session -- so this is how long customer data is kept
    expiry_days: 90
  - what: AWS Config's own configuration item history
    where: AWS Config service (not the S3 delivery files)
    reason: Was AWS's seven-year default; now as the delivered files
    expiry_days: 90
  - what: Elevation workflow execution history
    where: Step Functions (fedramp-20x-ksi-elevation)
    reason: Each elevation's input -- its justification and window -- and its steps; Step Functions keeps a closed execution 90 days, not configurable. The durable record is in the log store under elevations/
    expiry_days: 90
