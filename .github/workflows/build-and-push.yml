# Builds, scans, signs and publishes the two application images.
#
# This workflow carries more determinations than any other file in the
# repository:
#
#   KSI-IAM-SNU   No static credentials. AWS access is a short-lived session
#                 exchanged for a GitHub OIDC token.
#   KSI-SVC-VRI   Images signed at build, referenced by digest, signature
#                 verified before anything is deployed.
#   KSI-CMT-RMV   Registry push happens only here, and every digest is
#                 traceable to the commit that produced it.
#   KSI-CNA-DFP   Every action pinned to a commit SHA, not a tag. A tag is a
#                 mutable pointer; pinning to one means trusting whoever can
#                 move it.
#   KSI-SCR-MON   Dependencies scanned against advisory data on every build.
#   KSI-SCR-MIT   Build-time resolution only, verified rather than assumed.
#   KSI-CMT-LMC   The run emits a repository event into the log corpus.
#
# Every `uses:` below is pinned to a commit SHA with the human-readable tag
# in a trailing comment. The comment is documentation; the SHA is the
# contract.

name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag to publish. Tags are immutable, so a rebuild needs a new one.'
        required: true
        type: string

# Least privilege at the workflow level. `id-token: write` is what allows
# the OIDC token to be minted -- both for AWS federation and for keyless
# signing. `contents: read` is everything else this needs.
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  # Scanning runs before the build rather than after. A vulnerable
  # dependency set should fail before an image carrying it exists, not
  # after it has been published and then reported on.
  scan-dependencies:
    name: scan dependencies
    runs-on: ubuntu-latest
    # Seconds normally. Without one a hung job runs for GitHub's 6-hour default. Added 2026-10-01, when an api image build hung 21 minutes in docker build and was cancelled.
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, analytics]

    steps:
      - name: check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: set up python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # KSI-SCR-MIT build row 4: build-time resolution only, "checked
      # rather than assumed". A manifest without hashes would let a
      # substituted artifact through, so its absence is a failure here
      # rather than something noticed later.
      - name: require hashed, fully pinned manifest
        run: |
          set -euo pipefail
          manifest="app/${{ matrix.service }}/requirements.txt"

          if ! grep -q -- '--hash=sha256:' "$manifest"; then
            echo "::error file=$manifest::manifest carries no hashes; build-time integrity is unverifiable"
            exit 1
          fi

          # Every requirement line must pin an exact version. A range would
          # mean the resolved set could differ between this scan and the
          # build that follows it.
          if grep -E '^[A-Za-z0-9._-]+\s*(>=|<=|~=|>|<)' "$manifest"; then
            echo "::error file=$manifest::unpinned requirement found; only == is acceptable"
            exit 1
          fi

          echo "$manifest: hashed and fully pinned"

      # Here rather than in the build job so a failing test stops the image
      # before it exists, the same reason the scan runs first. The worker's
      # tests prove its high-water mark (DECISIONS.md, 2026-10-02); they are
      # hermetic, so they need none of the image's dependencies.
      - name: unit tests
        if: matrix.service == 'worker'
        working-directory: app
        run: python -m unittest -v worker.test_main

      - name: install scanner
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      # KSI-SCR-MON build row 1. pip-audit queries OSV, which is one of the
      # two advisory sources named in the 2026-09-19 decision; the GitHub
      # Advisory Database is the second and is reachable through the same
      # data.
      - name: audit dependencies
        run: |
          pip-audit \
            --requirement "app/${{ matrix.service }}/requirements.txt" \
            --strict \
            --desc \
            --format columns

  build:
    name: build and publish
    runs-on: ubuntu-latest
    # Two to three minutes normally, ARM64 under emulation. Without one a hung job runs for GitHub's 6-hour default. Added 2026-10-01, when an api image build hung 21 minutes in docker build and was cancelled.
    timeout-minutes: 30
    needs: scan-dependencies

    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]

    outputs:
      api-digest: ${{ steps.record.outputs.api-digest }}
      worker-digest: ${{ steps.record.outputs.worker-digest }}

    steps:
      - name: check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The federated exchange. No access key exists to leak, and the
      # session lasts as long as the job.
      - name: assume the build role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: build-${{ matrix.service }}-${{ github.run_id }}

      - name: log in to the registry
        id: login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: resolve the tag
        id: tag
        run: |
          # A dispatch supplies its own tag. A push derives one from the
          # commit, which keeps tags immutable without a human choosing a
          # new one each time.
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=git-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      # Build context is app/, not app/<service>/, because both services
      # share app/common/. See app/README.md.
      - name: build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app
          file: app/${{ matrix.service }}/Dockerfile
          push: true
          # The task definitions declare ARM64, and Fargate ARM costs less.
          platforms: linux/arm64
          tags: ${{ steps.login.outputs.registry }}/fedramp-20x-ksi/${{ matrix.service }}:${{ steps.tag.outputs.value }}
          # Provenance and SBOM attestations, which is what makes
          # KSI-CMT-RMV build row 4 -- every digest traced to the commit
          # that built it -- a property of the artifact rather than a note
          # in a log.
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}

      - name: install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # KSI-SVC-VRI build row 1, signed keylessly.
      #
      # The 2026-09-19 decision chose keyless over a managed signing
      # service: keyless means no signing key exists to store, protect or
      # rotate, which holds the KSI-IAM-SNU position rather than reopening
      # it. The identity in the signature is this workflow, in this
      # repository, at this commit -- bound by the same OIDC token used for
      # AWS, and recorded in a public transparency log.
      - name: sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.login.outputs.registry }}/fedramp-20x-ksi/${{ matrix.service }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # Verification runs here, against the signature just written, before
      # anything can deploy it. KSI-SVC-VRI build row 3 requires failure to
      # block rather than warn, which is what a failing step does.
      #
      # The identity conditions are the point: a signature is only
      # meaningful if you check *who* signed. Without them this verifies
      # that something signed it, which is not the claim being made.
      - name: verify the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.login.outputs.registry }}/fedramp-20x-ksi/${{ matrix.service }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-and-push.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: record the digest
        id: record
        run: |
          echo "${{ matrix.service }}-digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.service }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`${{ steps.tag.outputs.value }}\` |"
            echo "| digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # KSI-CMT-LMC build row 1: commit events into the central store.
  #
  # Emitted by the pipeline with the identity it already holds, rather than
  # by a webhook into a public endpoint. The 2026-09-19 decision records
  # why: a webhook would mean new ingress and a shared secret to rotate,
  # both for a delivery mechanism.
  #
  # The declared seam: this captures events that trigger a workflow run,
  # not every repository event. Branch protection routes changes through
  # pull requests, so coverage is good rather than total.
  # The analytics pipeline's image, for Cloud Run on GCP. The same steps as
  # the build job above -- scan first, build, sign, verify before recording
  # the digest -- with three differences: it authenticates to GCP by
  # workload identity federation, as the workflow-pinned principal that
  # holds the image publisher role on the Artifact Registry repository and
  # nothing else; it pushes there; and it builds linux/amd64, because Cloud
  # Run does not run arm64. Added 2026-10-02 (DECISIONS.md).
  build-analytics:
    name: build and publish (analytics)
    runs-on: ubuntu-latest
    # Two to three minutes normally. A hung job would otherwise run for GitHub's 6-hour default.
    timeout-minutes: 30
    needs: scan-dependencies
    env:
      REGISTRY: us-central1-docker.pkg.dev
      IMAGE: us-central1-docker.pkg.dev/fedramp-20x-ksi-assessment/fedramp-20x-ksi/analytics
    outputs:
      analytics-digest: ${{ steps.record.outputs.analytics-digest }}
    steps:
      - name: check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/921906217926/locations/global/workloadIdentityPools/github-actions/providers/github
          project_id: fedramp-20x-ksi-assessment

      # A short-lived token from the federated credentials, handed to docker
      # on stdin. cosign signs and verifies through the same login.
      - name: log in to the registry
        run: gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "$REGISTRY"

      - name: set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: resolve the tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=git-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app
          file: app/analytics/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}

      - name: install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: verify the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-and-push.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: record the digest
        id: record
        run: |
          echo "analytics-digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          {
            echo "### analytics"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`${IMAGE}@${{ steps.push.outputs.digest }}\` |"
            echo "| tag | \`${{ steps.tag.outputs.value }}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  emit-change-event:
    name: emit change event
    runs-on: ubuntu-latest
    # Seconds normally.
    timeout-minutes: 10
    needs: build
    if: always() && needs.build.result != 'cancelled'

    steps:
      - name: assume the build role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: emit-${{ github.run_id }}

      - name: put event
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          # KSI-CMT-LMC build row 4: every change record carries the
          # principal. `actor` is the human; `triggering_actor` differs on
          # a re-run, so both are recorded.
          detail=$(jq -nc \
            --arg commit "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF}" \
            --arg actor "${GITHUB_ACTOR}" \
            --arg triggering_actor "${GITHUB_TRIGGERING_ACTOR}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg result "${BUILD_RESULT}" \
            '{
               commit: $commit,
               ref: $ref,
               actor: $actor,
               triggering_actor: $triggering_actor,
               event: $event,
               run_id: $run_id,
               repository: $repository,
               result: $result
             }')

          aws events put-events --entries "$(jq -nc \
            --arg detail "$detail" \
            '[{
               Source: "fedramp-20x-ksi.pipeline",
               DetailType: "Repository Change",
               Detail: $detail
             }]')"
