# Runs the evidence collector in CI.
#
# Built in stages (DECISIONS.md, 2026-10-01). Stage A proved GitHub reaches
# GCP by workload identity federation, with no key. Stage C1, this one, runs
# every check that does not need Terraform state, as the collector's own
# identity in each cloud: an AWS role through the OIDC provider, and the
# federated principal in GCP. Stage C2 added the state-based checks: all
# three roots are initialised against their S3 state, and the GCP plan
# runs as the read-only principal with no impersonation.
#
# Daily since 2026-10-01: stricter than any cycle a determination requires,
# and free. 05:30 UTC, ahead of drift.yml at 07:00, so the two never contend
# for a Terraform state lock. Each run self-tests, collects, emits the SDR
# whatever the checks found, keeps both, and then fails if any check did --
# a red run is a finding to look at, not a broken job.
name: collect

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      skip:
        description: 'Space-separated check id globs to leave out (default: none)'
        required: false
        default: ''
        type: string

# `id-token: write` mints the OIDC token both clouds exchange. `actions:
# read` lets svc-acm-cfg-drift-workflow-active ask GitHub whether the drift
# workflow is still enabled (2026-10-02); it reads workflow metadata only.
permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # Seconds normally. A hung job would otherwise run for GitHub's 6-hour default.
    timeout-minutes: 15
    steps:
      - name: check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: set up python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: install collector dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: assume the collector role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_COLLECTOR_ROLE }}
          aws-region: us-east-1
          role-session-name: collect-${{ github.run_id }}

      # Direct workload identity federation: no service account, so nothing
      # to impersonate. The principal is this repository on main, and it
      # holds the collector's custom role and nothing else.
      - name: authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/921906217926/locations/global/workloadIdentityPools/github-actions/providers/github
          project_id: fedramp-20x-ksi-assessment

      - name: set up terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      # The drift and inventory checks read each root's state, and plan the
      # aws and gcp roots. Same backend settings as drift.yml.
      - name: initialise the roots
        run: |
          for root in aws gcp bootstrap; do
            terraform -chdir=infra/$root init -input=false \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="key=$root/terraform.tfstate" \
              -backend-config="region=us-east-1" \
              -backend-config="use_lockfile=true" \
              -backend-config="encrypt=true"
          done

      # The negative controls run every day, not only when someone remembers,
      # and so do the normalizer's and the metrics' tests. matrix_rows.py
      # --check fails if a check links a row the matrix lacks, or if the
      # matrix moved under the links (DECISIONS.md, 2026-10-02).
      - name: self-test the judgements
        run: |
          (cd collector && python self_test.py)
          (cd lambda/normalize_events && python -m unittest test_handler.py)
          (cd sdr && python -m unittest test_metrics.py test_matrix_rows.py)
          python sdr/matrix_rows.py --check

      - name: run the checks
        id: checks
        continue-on-error: true
        working-directory: collector
        env:
          GCP_IMPERSONATE: none
          GITHUB_TOKEN: ${{ github.token }}
          SKIP: ${{ inputs.skip }}
          # Plan as the federated principal itself; never as terraform-admin.
          TF_VAR_impersonate_service_account: ''
          TF_VAR_billing_alert_email: ${{ vars.BILLING_ALERT_EMAIL }}
          TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
          TF_VAR_gcp_pipeline_sa_unique_id: ${{ vars.GCP_PIPELINE_SA_UNIQUE_ID }}
          TF_VAR_app_domain: ${{ vars.APP_DOMAIN }}
        run: |
          set -f  # the globs are for run_checks.py, not the shell
          args=()
          for g in $SKIP; do args+=(--skip "$g"); done
          python run_checks.py --json results.json "${args[@]}"

      # The record store (SDR-CSX-KMT): this run's results, with what produced
      # them, written to the log store under collector-runs/. Object Locked
      # and under the evidence key. Written whatever the checks found.
      - name: store this run's record
        if: always() && hashFiles('collector/results.json') != ''
        env:
          BUCKET: fedramp-20x-ksi-log-store-437672023758
        run: |
          python - <<'PY'
          import json, os
          run = json.load(open("collector/results.json"))
          run["run"] = {
              "id": os.environ["GITHUB_RUN_ID"],
              "commit": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "runtime": "ci",
          }
          json.dump(run, open("record.json", "w"))
          PY
          day=$(python -c 'import json; print(json.load(open("record.json"))["started_at"][:10])')
          aws s3 cp record.json "s3://$BUCKET/collector-runs/dt=$day/run=$GITHUB_RUN_ID.json" --only-show-errors
          rm record.json

      - name: fetch the run history
        if: always() && hashFiles('collector/results.json') != ''
        env:
          BUCKET: fedramp-20x-ksi-log-store-437672023758
        run: aws s3 cp "s3://$BUCKET/collector-runs/" history/ --recursive --only-show-errors

      # Emitted whatever the checks found: a failing check is evidence too.
      - name: emit the security decision record
        if: always() && hashFiles('collector/results.json') != ''
        working-directory: sdr
        run: python emit.py --results ../collector/results.json --frr empty --runtime ci --history ../history

      - name: keep the results and the record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ github.run_id }}
          path: |
            collector/results.json
            sdr/out/
          if-no-files-found: warn
          retention-days: 90

      - name: fail if any check failed
        if: steps.checks.outcome == 'failure'
        run: |
          echo "::error::one or more checks failed or errored; see the run-the-checks step"
          exit 1
